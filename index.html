<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EgyMovies - موقع الأفلام</title>
  <style>
    body {
      background-color: #0f172a;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #38bdf8;
      margin-bottom: 30px;
    }
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      padding: 10px;
    }
    .movie-card {
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .movie-card img {
      width: 100%;
      height: 270px;
      object-fit: cover;
    }
    .rating-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.75);
      color: #facc15;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .movie-info {
      padding: 12px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .movie-info h3 {
      margin: 0 0 6px 0;
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .movie-info p {
      margin: 0 0 10px 0;
      color: #94a3b8;
      font-size: 0.85rem;
    }
    .watch-btn {
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .watch-btn:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>

  <h1>🎬 EgyMovies - أحدث الأفلام</h1>

  <!-- الحاوية التي ستظهر فيها الأفلام -->
  <div class="movies-grid" id="moviesContainer"></div>

  <script>
    const API_KEY = 'b744cb3f771d51f1cdfa3be751901eb4';
    const BASE_URL = 'https://api.themoviedb.org/3';
    const IMAGE_URL = 'https://image.tmdb.org/t/p/w500'; // تصحيح الرابط هنا

    async function fetchMovies() {
      try {
        const response = await fetch(`${BASE_URL}/movie/popular?api_key=${API_KEY}&language=ar-SA`);
        const data = await response.json();
        displayMovies(data.results);
      } catch (error) {
        console.error('Error fetching movies:', error);
      }
    }

    function displayMovies(movies) {
      const container = document.getElementById('moviesContainer');
      if (!container) return;
      
      container.innerHTML = '';

      movies.forEach(movie => {
        const posterPath = movie.poster_path ? `${IMAGE_URL}${movie.poster_path}` : 'https://via.placeholder.com/500x750?text=No+Image';
        const rating = movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A';
        const releaseYear = movie.release_date ? movie.release_date.split('-')[0] : '';

        const movieCard = `
          <div class="movie-card">
            <div class="rating-badge">★ ${rating}</div>
            <img src="${posterPath}" alt="${movie.title}" loading="lazy">
            <div class="movie-info">
              <h3>${movie.title}</h3>
              <p>${releaseYear}</p>
              <button class="watch-btn">مشاهدة الآن 🍿</button>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', movieCard);
      });
    }

    document.addEventListener('DOMContentLoaded', fetchMovies);
  </script>

</body>
</html>
