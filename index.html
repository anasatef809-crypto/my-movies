<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EgyMovies - موقع الأفلام والمسلسلات</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      padding-bottom: 40px;
    }
    header {
      background-color: #1e293b;
      padding: 15px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #38bdf8;
      text-decoration: none;
      cursor: pointer;
    }
    .search-box {
      width: 100%;
      max-width: 500px;
      display: flex;
      gap: 8px;
    }
    .search-box input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      outline: none;
    }
    .search-box button {
      padding: 10px 16px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .main-container {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 15px;
    }
    /* قسم المشغل */
    .player-section {
      background: #1e293b;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 30px;
      display: none;
    }
    .player-section h2 {
      margin-bottom: 12px;
      color: #38bdf8;
      font-size: 1.2rem;
    }
    .server-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .server-btn {
      padding: 6px 12px;
      background: #334155;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .server-btn.active {
      background: #0284c7;
    }
    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    /* قسم الأفلام */
    .section-title {
      margin-bottom: 15px;
      font-size: 1.3rem;
      border-right: 4px solid #0284c7;
      padding-right: 10px;
    }
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 15px;
    }
    .movie-card {
      background: #1e293b;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .movie-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(56, 189, 248, 0.2);
    }
    .movie-card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
    }
    .movie-card h3 {
      font-size: 0.85rem;
      padding: 8px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="loadTrendingMovies()">EgyMovies</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ابحث عن فيلم...">
      <button onclick="searchMovies()">بحث</button>
    </div>
  </header>

  <div class="main-container">
    
    <!-- مشغل الفيديو الحصين من التحويل والمحمي بـ sandbox -->
    <div class="player-section" id="playerSection">
      <h2 id="movieTitle">عنوان الفيلم</h2>
      <div class="server-buttons">
        <button class="server-btn active" onclick="changeServer(1)">سيرفر 1</button>
        <button class="server-btn" onclick="changeServer(2)">سيرفر 2</button>
      </div>
      <div class="video-container">
        <iframe 
          id="videoPlayer" 
          src="" 
          sandbox="allow-scripts allow-same-origin allow-forms" 
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <!-- شبكة عرض الأفلام الديناميكية -->
    <h2 class="section-title" id="gridTitle">أحدث الأفلام الشائعة</h2>
    <div class="movies-grid" id="moviesGrid"></div>

  </div>

  <script>
    const API_KEY = '5331f8ae6b13e89fb2b23a78dd063c80'; // API مفتاح TMDB
    let currentMovieId = null;

    // جلب الأفلام الشائعة عند فتح الصفحة
    async function loadTrendingMovies() {
      document.getElementById('gridTitle').innerText = 'أحدث الأفلام الشائعة';
      const response = await fetch(`https://api.themoviedb.org/3/trending/movie/week?api_key=${API_KEY}&language=ar-SA`);
      const data = await response.json();
      displayMovies(data.results);
    }

    // عرض الأفلام في الشبكة
    function displayMovies(movies) {
      const grid = document.getElementById('moviesGrid');
      grid.innerHTML = '';
      movies.forEach(movie => {
        if (!movie.poster_path) return;
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.onclick = () => selectMovie(movie.id, movie.title || movie.name);
        card.innerHTML = `
          <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" alt="${movie.title}">
          <h3>${movie.title || movie.name}</h3>
        `;
        grid.appendChild(card);
      });
    }

    // اختيار الفيلم للتشغيل
    function selectMovie(id, title) {
      currentMovieId = id;
      document.getElementById('movieTitle').innerText = title;
      changeServer(1);
      const playerSection = document.getElementById('playerSection');
      playerSection.style.display = 'block';
      playerSection.scrollIntoView({ behavior: 'smooth' });
    }

    // تغيير سيرفر التشغيل بدون إعلانات وتحويلات
    function changeServer(serverNumber) {
      const player = document.getElementById('videoPlayer');
      const buttons = document.querySelectorAll('.server-btn');
      buttons.forEach((btn, idx) => {
        if (idx === serverNumber - 1) btn.classList.add('active');
        else btn.classList.remove('active');
      });

      if (serverNumber === 1) {
        player.src = `https://vidsrc.to/embed/movie/${currentMovieId}`;
      } else if (serverNumber === 2) {
        player.src = `https://2embed.org/embed/movie?tmdb=${currentMovieId}`;
      }
    }

    // دالة البحث عن أفلام
    async function searchMovies() {
      const query = document.getElementById('searchInput').value;
      if (!query) return;
      document.getElementById('gridTitle').innerText = `نتائج البحث عن: ${query}`;
      const response = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}&language=ar-SA`);
      const data = await response.json();
      displayMovies(data.results);
    }

    // تشغيل القائمة تلقائياً عند تحميل الصفحة
    loadTrendingMovies();
  </script>

</body>
</html>
