<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأفلام والمسلسلات</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #141414; color: #fff; font-family: system-ui, -apple-system, sans-serif; padding: 20px; text-align: center; }
        header { margin-bottom: 30px; border-bottom: 2px solid #e50914; padding-bottom: 15px; }
        h1 { color: #e50914; font-size: 28px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #222; border-radius: 12px; padding: 15px; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .card h2 { margin-bottom: 15px; font-size: 20px; color: #fff; }
        video { width: 100%; border-radius: 8px; outline: none; background: #000; }
    </style>
</head>
<body>

    <header>
        <h1>🎬 إيجي أفلام - المشاهدة المجانية</h1>
    </header>

    <div class="container">
        <div class="card">
            <h2>فيديو تجريبي (مشغل مباشر)</h2>
            <video controls poster="https://via.placeholder.com/800x450/000000/FFFFFF?text=Click+Play">
                <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
                متصفحك لا يدعم تشغيل الفيديو.
            </video>
        </div>
    </div>

</body>
</html>
