<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EgyMovies - موقع الأفلام والمسلسلات</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      padding-bottom: 40px;
    }
    header {
      background-color: #1e293b;
      padding: 15px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #38bdf8;
      text-decoration: none;
      cursor: pointer;
    }
    .search-box {
      width: 100%;
      max-width: 500px;
      display: flex;
      gap: 8px;
    }
    .search-box input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      outline: none;
    }
    .search-box button {
      padding: 10px 16px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .main-container {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 15px;
    }
    /* قسم مشغل الفيديو */
    .player-section {
      background: #1e293b;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 30px;
      display: none; /* يظهر فقط عند اختيار فيلم */
    }
    .player-section h2 {
      margin-bottom: 12px;
      color: #38bdf8;
      font-size: 1.2rem;
    }
    .video-container {
      position: relative;
      padding-bottom: 56.25%; /* نسبة 16:9 */
      height: 0;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    /* شبكة الأفلام */
    .section-title {
      margin-bottom: 15px;
      font-size: 1.3rem;
      border-right: 4px solid #0284c7;
      padding-right: 10px;
    }
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
    }
    .movie-card {
      background: #1e293b;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .movie-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(56, 189, 248, 0.2);
    }
    .movie-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }
    .movie-card h3 {
      font-size: 0.95rem;
      padding: 10px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="location.reload()">EgyMovies</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ابحث عن فيلم...">
      <button onclick="searchMovie()">بحث</button>
    </div>
  </header>

  <div class="main-container">
    
    <!-- مشغل الفيديو الحصين من التحويل الإجباري -->
    <div class="player-section" id="playerSection">
      <h2 id="movieTitle">عنوان الفيلم</h2>
      <div class="video-container">
        <!-- أضفنا sandbox لمنع السيرفر الخارجي من فتح صفحات جديدة أو تحويل الموقع -->
        <iframe 
          id="videoPlayer" 
          src="" 
          sandbox="allow-scripts allow-same-origin allow-forms" 
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <!-- قائمة الأفلام -->
    <h2 class="section-title">أحدث الأفلام والمسلسلات</h2>
    <div class="movies-grid" id="moviesGrid">
      
      <!-- مثال لفيلم (يمكنك تكراره وتغيير البيانات) -->
      <div class="movie-card" onclick="playMovie('فيلم تجريبي 1', 'https://www.youtube.com/embed/dQw4w9WgXcQ')">
        <img src="https://via.placeholder.com/150x220/1e293b/ffffff?text=Movie+1" alt="فيلم 1">
        <h3>فيلم تجريبي 1</h3>
      </div>

      <div class="movie-card" onclick="playMovie('فيلم تجريبي 2', 'https://www.youtube.com/embed/dQw4w9WgXcQ')">
        <img src="https://via.placeholder.com/150x220/1e293b/ffffff?text=Movie+2" alt="فيلم 2">
        <h3>فيلم تجريبي 2</h3>
      </div>

    </div>

  </div>

  <script>
    // دالة تشغيل الفيلم وتمرير الرابط للمشغل
    function playMovie(title, embedUrl) {
      const playerSection = document.getElementById('playerSection');
      const videoPlayer = document.getElementById('videoPlayer');
      const movieTitle = document.getElementById('movieTitle');

      movieTitle.innerText = title;
      videoPlayer.src = embedUrl;
      playerSection.style.display = 'block';

      // التمرير السلس للمشغل عند الضغط على فيلم
      playerSection.scrollIntoView({ behavior: 'smooth' });
    }

    // دالة البحث البسيطة
    function searchMovie() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.movie-card');

      cards.forEach(card => {
        const title = card.querySelector('h3').innerText.toLowerCase();
        if (title.includes(query)) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }
  </script>

</body>
</html>
