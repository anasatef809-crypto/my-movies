<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إيجي أفلام - منصة المشاهدة المجانية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #141414; 
            color: #fff; 
            font-family: system-ui, -apple-system, sans-serif; 
            padding: 20px 15px; 
        }
        
        header { 
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px; 
            border-bottom: 2px solid #e50914; 
            padding-bottom: 15px; 
        }
        h1 { color: #e50914; font-size: 22px; font-weight: bold; cursor: pointer; }
        
        /* مشغل الفيديو للمشاهدة */
        .player-section {
            display: none;
            max-width: 900px;
            margin: 0 auto 30px auto;
            background: #222;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
        }
        .player-section h2 { margin-bottom: 12px; font-size: 18px; color: #fff; }
        video { width: 100%; border-radius: 8px; background: #000; outline: none; }
        .close-btn {
            background: #444; color: #fff; border: none; padding: 6px 15px; 
            border-radius: 5px; cursor: pointer; margin-top: 10px; font-weight: bold;
        }

        /* شبكة الأفلام */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .movie-card {
            background: #222;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .poster-wrapper {
            position: relative;
            width: 100%;
            padding-top: 140%;
        }

        .poster-wrapper img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
        }

        .rating {
            position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.8);
            color: #ffc107; padding: 3px 6px; border-radius: 5px; font-size: 12px; font-weight: bold;
        }

        .movie-info { padding: 10px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .movie-title { font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .movie-meta { font-size: 11px; color: #aaa; margin-bottom: 10px; }
        
        .watch-btn {
            background: #e50914; color: #fff; border: none; text-align: center;
            padding: 8px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; width: 100%;
        }
        .watch-btn:hover { background: #b80710; }
    </style>
</head>
<body>

    <header>
        <h1 onclick="closePlayer()">🎬 إيجي أفلام</h1>
    </header>

    <!-- قسم المشغل (بيفتح لما تضغط مشاهدة) -->
    <div id="playerSection" class="player-section">
        <h2 id="videoTitle">جاري المشاهدة...</h2>
        <video id="mainVideo" controls poster="">
            <source id="videoSource" src="" type="video/mp4">
            متصفحك لا يدعم التشغيل.
        </video>
        <button class="close-btn" onclick="closePlayer()">✖ إغلاق المشغل</button>
    </div>

    <!-- شبكة كروت الأفلام -->
    <div class="movies-grid">

        <div class="movie-card">
            <div class="poster-wrapper">
                <span class="rating">⭐ 8.8</span>
                <img src="https://m.media-amazon.com/images/M/MVBMTk3MTM4NjI1Ml5BMl5BanBnXkFtZTcwMzE4MjA3Mw@@._V1_FMjpg_UX1000_.jpg" alt="Inception">
            </div>
            <div class="movie-info">
                <div class="movie-title">Inception</div>
                <div class="movie-meta">2010 • خيال علمي</div>
                <button class="watch-btn" onclick="playMovie('Inception', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4')">مشاهدة الآن 🍿</button>
            </div>
        </div>

        <div class="movie-card">
            <div class="poster-wrapper">
                <span class="rating">⭐ 9.0</span>
                <img src="https://m.media-amazon.com/images/M/MVBMTMxMTQzNTU5MF5BMl5BanBnXkFtZTcwMDM4MjA0Mw@@._V1_.jpg" alt="The Dark Knight">
            </div>
            <div class="movie-info">
                <div class="movie-title">The Dark Knight</div>
                <div class="movie-meta">2008 • أكشن</div>
                <button class="watch-btn" onclick="playMovie('The Dark Knight', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4')">مشاهدة الآن 🍿</button>
            </div>
        </div>

        <div class="movie-card">
            <div class="poster-wrapper">
                <span class="rating">⭐ 8.6</span>
                <img src="https://m.media-amazon.com/images/M/MVBNzA1Njg5NDM2N15BMl5BanBnXkFtZTgwNzA2NTM1MDM@._V1_.jpg" alt="Interstellar">
            </div>
            <div class="movie-info">
                <div class="movie-title">Interstellar</div>
                <div class="movie-meta">2014 • دراما / مغامرة</div>
                <button class="watch-btn" onclick="playMovie('Interstellar', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4')">مشاهدة الآن 🍿</button>
            </div>
        </div>

    </div>

    <!-- كود الجافاسكربت لتشغيل الأفلام فوراً -->
    <script>
        function playMovie(title, url) {
            document.getElementById('videoTitle').innerText = "جاري مشاهدة: " + title;
            var video = document.getElementById('mainVideo');
            var source = document.getElementById('videoSource');
            source.src = url;
            video.load();
            document.getElementById('playerSection').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            video.play();
        }

        function closePlayer() {
            var video = document.getElementById('mainVideo');
            video.pause();
            document.getElementById('playerSection').style.display = 'none';
        }
    </script>
</body>
</html>
