<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EgyMovies - موقع الأفلام والمسلسلات</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      padding-bottom: 40px;
    }

    /* الهيدر وشريط البحث */
    header {
      background-color: #1e293b;
      padding: 15px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #38bdf8;
      text-decoration: none;
    }
    .search-box {
      width: 100%;
      max-width: 500px;
      display: flex;
      gap: 8px;
    }
    .search-box input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      outline: none;
    }
    .search-box button {
      padding: 10px 16px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    /* أزرار التصنيفات */
    .categories-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 15px 20px;
      white-space: nowrap;
      scrollbar-width: none; /* إخفاء شريط التمرير */
    }
    .categories-bar::-webkit-scrollbar {
      display: none;
    }
    .cat-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .cat-btn.active, .cat-btn:hover {
      background: #0284c7;
      color: #fff;
      border-color: #0284c7;
    }

    /* عنوان القسم */
    .section-title {
      padding: 10px 20px;
      font-size: 1.2rem;
      color: #e2e8f0;
    }

    /* شبكة العرض (Grid) */
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 10px 20px;
    }
    @media (min-width: 600px) {
      .movies-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 20px;
      }
    }

    /* كارت الفيلم */
    .movie-card {
      background: #1e293b;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .movie-card img {
      width: 100%;
      height: 230px;
      object-fit: cover;
    }
    .rating-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.8);
      color: #facc15;
      padding: 3px 6px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.75rem;
    }
    .movie-info {
      padding: 10px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .movie-info h3 {
      margin: 0 0 4px 0;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .movie-info p {
      margin: 0 0 8px 0;
      color: #94a3b8;
      font-size: 0.75rem;
    }
    .watch-btn {
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.8rem;
    }
    .watch-btn:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>

  <!-- الهيدر -->
  <header>
    <a href="#" class="logo" onclick="loadPopular()">🎬 EgyMovies</a>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل...">
      <button onclick="searchMovies()">بحث</button>
    </div>
  </header>

  <!-- شريط التصنيفات (متحرك باللمس) -->
  <div class="categories-bar">
    <button class="cat-btn active" onclick="filterGenre('', this)">الأحدث 🍿</button>
    <button class="cat-btn" onclick="filterGenre('28', this)">أكشن 💥</button>
    <button class="cat-btn" onclick="filterGenre('35', this)">كوميدي 🎭</button>
    <button class="cat-btn" onclick="filterGenre('27', this)">رعب 👻</button>
    <button class="cat-btn" onclick="filterGenre('10749', this)">رومانسي ❤️</button>
    <button class="cat-btn" onclick="filterGenre('878', this)">خيال علمي 🚀</button>
    <button class="cat-btn" onclick="filterGenre('16', this)">انيميشن 🎨</button>
  </div>

  <h2 class="section-title" id="sectionTitle">أحدث الأفلام والمسلسلات</h2>

  <!-- شبكة الأفلام -->
  <div class="movies-grid" id="moviesContainer"></div>

  <script>
    const API_KEY = 'b744cb3f771d51f1cdfa3be751901eb4';
    const BASE_URL = 'https://api.themoviedb.org/3';
    const IMAGE_URL = 'https://image.tmdb.org/t/p/w500';

    // جلب الأفلام الشائعة
    async function loadPopular() {
      document.getElementById('sectionTitle').innerText = 'أحدث الأفلام والمسلسلات';
      fetchData(`${BASE_URL}/movie/popular?api_key=${API_KEY}&language=ar-SA`);
    }

    // الفلترة حسب التصنيف
    function filterGenre(genreId, btnElement) {
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      if (!genreId) {
        loadPopular();
        return;
      }
      document.getElementById('sectionTitle').innerText = 'نتائج التصنيف';
      fetchData(`${BASE_URL}/discover/movie?api_key=${API_KEY}&language=ar-SA&with_genres=${genreId}`);
    }

    // دالة البحث
    function searchMovies() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;
      document.getElementById('sectionTitle').innerText = `نتائج البحث عن: ${query}`;
      fetchData(`${BASE_URL}/search/movie?api_key=${API_KEY}&language=ar-SA&query=${encodeURIComponent(query)}`);
    }

    // جلب البيانات وعرضها
    async function fetchData(url) {
      try {
        const response = await fetch(url);
        const data = await response.json();
        displayMovies(data.results);
      } catch (error) {
        console.error('Error:', error);
      }
    }

    // طباعة الكروت
    function displayMovies(movies) {
      const container = document.getElementById('moviesContainer');
      container.innerHTML = '';

      if (!movies || movies.length === 0) {
        container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #94a3b8;">لم يتم العثور على أي نتائج 😅</p>';
        return;
      }

      movies.forEach(movie => {
        const posterPath = movie.poster_path ? `${IMAGE_URL}${movie.poster_path}` : 'https://via.placeholder.com/500x750?text=No+Image';
        const rating = movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A';
        const releaseYear = movie.release_date ? movie.release_date.split('-')[0] : '';

        const movieCard = `
          <div class="movie-card">
            <div class="rating-badge">★ ${rating}</div>
            <img src="${posterPath}" alt="${movie.title}" loading="lazy">
            <div class="movie-info">
              <h3>${movie.title}</h3>
              <p>${releaseYear}</p>
              <button class="watch-btn">مشاهدة الآن 🍿</button>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', movieCard);
      });
    }

    // التشغيل التلقائي عند التحميل
    document.addEventListener('DOMContentLoaded', loadPopular);
  </script>
</body>
</html>
