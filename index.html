<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأفلام والمسلسلات</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #141414; color: #fff; font-family: system-ui, -apple-system, sans-serif; padding: 20px; text-align: center; }
        header { margin-bottom: 30px; border-bottom: 2px solid #e50914; padding-bottom: 15px; }
        h1 { color: #e50914; font-size: 28px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #222; border-radius: 12px; padding: 15px; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .card h2 { margin-bottom: 15px; font-size: 20px; color: #fff; }
        .video-box { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; }
        .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>

    <header>
        <h1>🎬 إيجي أفلام - المشاهدة المجانية</h1>
    </header>

    <div class="container">
        <div class="card">
            <h2>عرض تجريبي لمشغل الفيديو</h2>
            <div class="video-box">
                <!-- رابط سيرفر الفيديو يوضع هنا -->
                <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
            </div>
        </div>
    </div>

</body>
</html>
