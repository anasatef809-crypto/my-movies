<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إيجي أفلام</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #141414; 
            color: #fff; 
            font-family: system-ui, -apple-system, sans-serif; 
            padding: 20px 15px; 
        }
        
        header { 
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px; 
            border-bottom: 2px solid #e50914; 
            padding-bottom: 15px; 
        }
        h1 { color: #e50914; font-size: 22px; font-weight: bold; cursor: pointer; }
        
        .search-box input {
            background: #333;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 20px;
            color: #fff;
            outline: none;
            font-size: 13px;
            width: 140px;
        }

        .player-section {
            display: none;
            max-width: 900px;
            margin: 0 auto 30px auto;
            background: #222;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
        }
        .player-section h2 { margin-bottom: 12px; font-size: 18px; color: #fff; }
        
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            background: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }

        .close-btn {
            background: #e50914; color: #fff; border: none; padding: 8px 18px; 
            border-radius: 5px; cursor: pointer; margin-top: 12px; font-weight: bold;
            font-size: 13px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .movie-card {
            background: #222;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .poster-wrapper {
            position: relative;
            width: 100%;
            padding-top: 145%;
            background: #1a1a1a;
        }

        .poster-wrapper img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
        }

        .rating {
            position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.85);
            color: #ffc107; padding: 3px 6px; border-radius: 5px; font-size: 11px; font-weight: bold;
            z-index: 2;
        }

        .movie-info { padding: 10px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .movie-title { font-size: 13px; font-weight: bold; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-meta { font-size: 11px; color: #aaa; margin-bottom: 10px; }
        
        .watch-btn {
            background: #e50914; color: #fff; border: none; text-align: center;
            padding: 7px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; width: 100%;
        }
        .watch-btn:hover { background: #b80710; }
    </style>
</head>
<body>

    <header>
        <h1 onclick="closePlayer()">🎬 إيجي أفلام</h1>
        <div class="search-box">
            <input type="text" id="searchInput" onkeyup="searchMovies()" placeholder="بحث عن فيلم...">
        </div>
    </header>

    <div id="playerSection" class="player-section">
        <h2 id="videoTitle">جاري المشاهدة...</h2>
        <div class="video-container">
            <iframe id="mainIframe" src="" allowfullscreen></iframe>
        </div>
        <button class="close-btn" onclick="closePlayer()">إغلاق المشغل ✖</button>
    </div>

    <div class="movies-grid" id="moviesGrid">

        <!-- Inception -->
        <div class="movie-card">
            <div class="poster-wrapper">
                <span class="rating">⭐ 8.8</span>
                <img src="https://image.tmdb.org/t/p/w500/ljs2A82B33yVJ8pA39A2i9E90o8.jpg" alt="Inception">
            </div>
            <div class="movie-info">
                <div class="movie-title">Inception</div>
                <div class="movie-meta">2010 • خيال علمي</div>
                <button class="watch-btn" onclick="playMovie('Inception', 'https://www.2embed.cc/embed/tt1375666')">مشاهدة الآن 🍿</button>
            </div>
        </div>

        <!-- The Dark Knight -->
        <div class="movie-card">
            <div class="poster-wrapper">
                <span class="rating">⭐ 9.0</span>
                <img src="https://image.tmdb.org/t/p/w500/qJ2tW6WM3L2i3M3342.jpg" alt="The Dark Knight" onerror="this.src='https://m.media-amazon.com/images/M/MVBMTMxMTQzNTU5MF5BMl5BanBnXkFtZTcwMDM4MjA0Mw@@._V1_.jpg'">
            </div>
            <div class="movie-info">
                <div class="movie-title">The Dark Knight</div>
                <div class="movie-meta">2008 • أكشن</div>
                <button class="watch-btn" onclick="playMovie('The Dark Knight', 'https://www.2embed.cc/embed/tt0468569')">مشاهدة الآن 🍿</button>
            </div>
        </div>

        <!-- Interstellar -->
        <div class="movie-card">
            <div class="poster-wrapper">
                <span class="rating">⭐ 8.6</span>
                <img src="https://image.tmdb.org/t/p/w500/gEU2G3L321111.jpg" alt="Interstellar" onerror="this.src='https://m.media-amazon.com/images/M/MVBNzA1Njg5NDM2N15BMl5BanBnXkFtZTgwNzA2NTM1MDM@._V1_.jpg'">
            </div>
            <div class="movie-info">
                <div class="movie-title">Interstellar</div>
                <div class="movie-meta">2014 • دراما</div>
                <button class="watch-btn" onclick="playMovie('Interstellar', 'https://www.2embed.cc/embed/tt0816692')">مشاهدة الآن 🍿</button>
            </div>
        </div>

        <!-- Avengers: Endgame -->
        <div class="movie-card">
            <div class="poster-wrapper">
                <span class="rating">⭐ 8.4</span>
                <img src="https://image.tmdb.org/t/p/w500/or06ip3aP1111.jpg" alt="Avengers: Endgame" onerror="this.src='https://m.media-amazon.com/images/M/MVBMjMwMDM3NjU2NV5BMl5BanBnXkFtZTgwNzM5MDM1MDE@._V1_.jpg'">
            </div>
            <div class="movie-info">
                <div class="movie-title">Avengers: Endgame</div>
                <div class="movie-meta">2019 • أبطال خارقون</div>
                <button class="watch-btn" onclick="playMovie('Avengers: Endgame', 'https://www.2embed.cc/embed/tt4154796')">مشاهدة الآن 🍿</button>
            </div>
        </div>

    </div>

    <script>
        function playMovie(title, url) {
            document.getElementById('videoTitle').innerText = "جاري مشاهدة: " + title;
            var iframe = document.getElementById('mainIframe');
            iframe.src = url;
            document.getElementById('playerSection').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closePlayer() {
            var iframe = document.getElementById('mainIframe');
            iframe.src = "";
            document.getElementById('playerSection').style.display = 'none';
        }

        function searchMovies() {
            var input = document.getElementById('searchInput').value.toLowerCase();
            var cards = document.getElementsByClassName('movie-card');
            for (var i = 0; i < cards.length; i++) {
                var title = cards[i].querySelector('.movie-title').innerText.toLowerCase();
                cards[i].style.display = title.includes(input) ? "flex" : "none";
            }
        }
    </script>
</body>
</html>
